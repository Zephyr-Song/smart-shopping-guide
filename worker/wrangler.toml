name = "bfc-agent"
main = "index.ts"
compatibility_date = "2024-09-23"

# 前端调用地址（部署后 wrangler 会输出 *.workers.dev 域名，也可绑定自定义域）
# 把该地址填到前端的环境变量 VITE_AGENT_API_URL

# LLM 配置（OpenAI 兼容接口，DeepSeek / 通义 / Kimi / OpenAI 皆可）
# 下面两个是明文变量；密钥请一定用 secret（见下方说明），不要写进文件提交。
[vars]
LLM_BASE_URL = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"

# 密钥（不要提交！用命令设置）：
#   npx wrangler secret put LLM_API_KEY
# 部署：
#   npx wrangler deploy
