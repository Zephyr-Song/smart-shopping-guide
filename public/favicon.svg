<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23262f"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D58A"/>
      <stop offset="0.55" stop-color="#D9B36A"/>
      <stop offset="1" stop-color="#B6862C"/>
    </linearGradient>
  </defs>
  <!-- 墨色圆角底 + 青铜描边（呼应 3D 复星艺术中心青铜冠带） -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="none" stroke="url(#bronze)" stroke-width="2.2" opacity="0.7"/>
  <!-- BFC 字标 -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', 'Arial Narrow', Arial, sans-serif"
        font-size="23" font-weight="700" letter-spacing="1.5"
        fill="url(#bronze)">BFC</text>
</svg>
