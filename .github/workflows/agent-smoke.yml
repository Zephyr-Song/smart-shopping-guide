name: Agent Smoke Test

# 架构：Cloudflare Pages 一体化（前端 + /api 同域）
# 部署后手工触发，验证真实 agent 端到端可用。
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/agent (real agent end-to-end)
        run: |
          echo "=== health ==="
          curl -s -w "\n[HTTP %{http_code}]\n" \
            "https://bfc-shopping-guide.pages.dev/api/health" --max-time 30

          echo ""
          echo "=== 楼层 / 知识类 ==="
          curl -s -w "\n[HTTP %{http_code}] t=%{time_total}s\n" \
            -X POST "https://bfc-shopping-guide.pages.dev/api/agent" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"博悦汇影城在几楼？"}]}' \
            --max-time 90 | head -c 2000

          echo ""
          echo "=== 预算 + 人数（工具调用 / 卡片） ==="
          curl -s -w "\n[HTTP %{http_code}] t=%{time_total}s\n" \
            -X POST "https://bfc-shopping-guide.pages.dev/api/agent" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"预算500两个人吃什么？"}]}' \
            --max-time 90 | head -c 3000
